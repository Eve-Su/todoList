spring:
  application:
    name: ai-platform-api
  main:
    web-application-type: servlet
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/ag_platform?currentSchema=agent_bus
    username: postgres
    password: '1234'

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 18080

logging:
  config: classpath:logback-spring.xml

platform:
  clients:
    knowledge-service:
      base-url: http://localhost:18081
